spack:
  packages:
    all:
      # Ordered preference list: spack takes the first host-compatible entry and
      # silently skips the rest (x86_64 on Apple silicon, m6/m5 until those
      # exist), so the Linux targets MUST stay last -- aarch64 is compatible on
      # Apple silicon and would otherwise win over the tuned m-series targets.
      # Most-specific first, so each host builds for itself.
      target: [m6, m5, m4, m3, m2, m1, x86_64, aarch64]
      variants:
        - build_type=RelWithDebInfo
        - 'cxxstd=20'
      buildable: true
      providers:
        gl: [mesa]
        glu: [mesa]

    # Keep the commits of the existing install, so that rebuilding against the
    # CoreML-enabled onnxruntime does not also move these to today's main.
    # These replace the requirements in ../mucoll-common/packages.yaml, so they
    # repeat them.
    acts:
      require: '@main+dd4hep+json+edm4hep+examples+geant4+hepmc3+python cxxstd=20'
    k4actstracking:
      require: '@main+gnn'
    # Same for the other dd4hep dependents, rebuilt for the macOS plugin-search
    # patch in ../../packages/dd4hep.
    k4geo:
      require: '@main~beampipe_stl'
    k4gaudipandora:
      require: '@main~ddkaltest'
    k4simgeant4:
      require: '@main'
    k4clue:
      require: '@main'

  concretizer:
    unify: true
    targets:
      host_compatible: true

  view: false

  include:
  # Listed first = higher precedence: spack applies includes in reverse order,
  # so these darwin overrides win over ../mucoll-common/packages.yaml.
  - path: ../mucoll-common/packages-darwin.yaml
    when: platform == "darwin"
  - ../mucoll-common/packages.yaml

  specs:
  - mucoll-stack~devtools+pytools+ml+sim