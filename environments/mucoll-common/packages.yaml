packages:
  all:
    target: [m1,m2,m3,m4,m5,m6]
    variants: build_type=Release cxxstd=20
    buildable: true

  # Use the system OpenGL as recommended by spack
  # See https://github.com/key4hep/key4hep-spack/issues/318 and
  # https://github.com/key4hep/key4hep-spack/issues/516
  # A version is needed and we set it to 99 so that spack thinks it's the latest
  # (it may not work if the versions in the current system are not what's required
  # but that hasn't happened yet)
  opengl:
    buildable: False
    externals:
    - spec: opengl@99
      prefix: /usr
  openglu:
    buildable: False
    externals:
    - spec: openglu@99
      prefix: /usr
  # llvm is built inside the stack, slimmed down so it fits the free GitHub
  # runners (4 cores, 16 GB RAM, 6 h job limit):
  #  - build_type=Release: the environment default (RelWithDebInfo) makes the
  #    LLVM links huge and is what OOM-kills the build.
  #  - targets=none: only the host backend (X86 or AArch64, added automatically
  #    by the recipe), instead of all ~20 backends.
  #  - ~llvm_dylib: py-llvmlite links the static LLVM libraries, so the extra
  #    libLLVM.so (one very large link) is not needed.
  #  - ~clang: nothing in the stack needs clang (py-llvmlite only needs the
  #    LLVM libraries), and it is the largest part of the build. Without clang
  #    there is also no openmp, compiler-rt, libc++ or libunwind to build.
  #  - no lldb/polly/mlir/flang/offload/gold plugin.
  #  - the packages/llvm overlay also caps parallel link jobs and skips
  #    tests/benchmarks.
  llvm:
    require: >-
      build_type=Release targets=none
      ~clang +lld ~lldb ~lua ~polly ~mlir ~flang ~offload ~libomptarget ~gold
      ~llvm_dylib ~python ~z3 ~cuda
      compiler-rt=none libcxx=none libunwind=none

  boost:
    require: +python
    buildable: true

  delphes:
    require: "@master"

  # Ask for Python > 3.11
  # Since many packages depend on setuptools that was dropped in 3.12,
  # without asking explicitly the version used will be 3.11
  python:
    require: "@3.12: +optimizations"

  madgraph5amc:
    require: '@3.5.9: +pythia8'

  # needed by Alma9 to support AVX2 instructions
  binutils:
    require: +gas
  gdb:
    require: +python+tui+source-highlight~debuginfod

  xrootd:
    require: +krb5 cxxstd=20

  root:
    require: '@6.36: +davix+fftw+gsl+math+minuit+mlp+opengl~pythia8+python+r+roofit+root7+rpath~shadow+spectrum+sqlite+ssl+tbb+tmva+tmva-cpu+unuran+vc+vdt+webgui~x+xml+xrootd cxxstd=20'

  hdf5:
    require: +cxx+hl
  hepmc3:
    require: +python+rootio

  py-pandas:
    require: ~excel~parquet
  

  # py-torch is built +valgrind, and valgrind is built +boost by default. boost
  # legitimately has two configs (a rich +filesystem/+program_options/... build
  # for the sim stack vs a lean build for analysis), which would otherwise be
  # dragged into py-torch through valgrind. Dropping valgrind's boost dependency
  # severs that amplifier so py-torch stays a single build; boost itself may
  # still have two (cheap) configs, but nothing expensive rides on the split.
  valgrind:
    require: '~boost'

  # Pin py-torch to the latest series. Use a floor (not an
  # exact pin) so future releases are picked up automatically.
  py-torch:
    require: '@2.8:+custom-protobuf'

  # The versions of py-onnx and py-onnxruntime should be consistent based on this table
  # https://onnxruntime.ai/docs/reference/compatibility.html#onnx-opset-support
  py-onnx:
    require: '@1.16:'
  py-onnxruntime:
    require:
    - '@1.18:'
    # CoreML execution provider, to run the GNN models on the Apple GPU
    - spec: '+coreml'
      when: 'platform=darwin'

  geant4:
    require: ~opengl~qt~vecgeom~examples +ipo cxxstd=20

  pythia8:
    require: +python+lhapdf+gzip

  edm4hep:
    require: '@1.1'

  k4fwcore:
    require: '@1.7'

  dd4hep:
    require: '+edm4hep+xercesc+hepmc3'
  acts:
    # +examples+python: the ACTS python bindings (acts.examples.*) are the entry
    # point for the material mapping workflow. +hepmc3 keeps hepmc3 explicitly in
    # the DAG for acts.examples.hepmc3, which material_recording.py imports (the
    # matching cmake option no longer exists upstream, so it is otherwise a no-op).
    # The packages/acts overlay is what actually makes the bindings get built and
    # installs the Examples/Scripts/Python helper scripts -- see the comment there.
    require: '@main+dd4hep+json+edm4hep+examples+geant4+hepmc3+python cxxstd=20'
  # ~beampipe_stl: skip the network download of the FCC-ee MDI beampipe CAD,
  # which MuColl does not use (and which intermittently breaks the build). The
  # variant used to be carried by a local packages/k4geo overlay; it has since
  # landed upstream, so the plain upstream recipe is enough.
  k4geo:
    require: '@main~beampipe_stl'
  k4gen:
    require: '@0.1pre16'
  k4gaudipandora:
    require: '@main~ddkaltest'
  k4reco:
    require: '@0.3~conformal_tracking'

  k4actstracking:
    require: '@main+gnn'
  k4simgeant4:
    require: '@main'
  k4clue:
    require: '@main'

  lccontent:
    require: ~monitoring
