name: Physics validation

# Reusable per-particle physics-validation pipeline. SIM, DIGI, and RECO run as
# independent jobs, forwarding their output and production provenance as
# artifacts. The large image is launched manually after each job frees disk.

on:
  workflow_call:
    inputs:
      image:
        description: "Image to run the chain in (registry/owner/name:tag)"
        required: true
        type: string
      pdg:
        description: "PDG id of the gun particle (the particle label is inferred from this)"
        required: false
        type: string
        default: "-13"
      geometry:
        description: "Detector geometry name"
        required: false
        type: string
        default: MAIA_v0
      n-events:
        description: "Number of events to process"
        required: false
        type: string
        default: "1000"

permissions:
  contents: read

# mucoll-benchmarks: track the head of main. The repo carries its geometry
# digi/reco configs as submodules, so each checkout must pull them recursively.
# The plotting studies (analysis/python/edm4hep/study_*.py) live in the repo
# itself, so they need no submodule.
env:
  BENCHMARKS_REPO: https://github.com/MuonColliderSoft/mucoll-benchmarks.git
  BENCHMARKS_REF: main

defaults:
  run:
    shell: bash

jobs:
  # Infer the particle label from the PDG id. Runs directly on the runner (no
  # container) so it adds no image pull. Used for artifact names + Pages subdir.
  meta:
    runs-on: ubuntu-latest
    outputs:
      particle: ${{ steps.map.outputs.particle }}
    steps:
      - id: map
        env:
          PDG: ${{ inputs.pdg }}
        run: |
          apdg=${PDG#-}   # drop sign: particle == antiparticle for labelling
          case "$apdg" in
            11)   name=electron ;;
            13)   name=muon ;;
            211)  name=pion ;;
            22)   name=photon ;;
            *)    name="pdg${PDG}" ;;
          esac
          echo "Mapped PDG ${PDG} -> ${name}"
          echo "particle=${name}" >> "$GITHUB_OUTPUT"

  sim:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false
      - uses: actions/checkout@v6
      - name: Clone benchmarks
        run: |
          git clone --branch "${BENCHMARKS_REF}" --depth 1 "${BENCHMARKS_REPO}" benchmarks
          git -C benchmarks submodule update --init --recursive --depth 1
      - name: Download generated input
        # Pre-generated particle-gun file. 
        # Stored as asset on the 'phys-val-inputs' release; one
        # file per particle label inferred from the PDG id.
        run: |
          curl -fSL --retry 3 -o gen.edm4hep.root \
            "https://github.com/${{ github.repository }}/releases/download/phys-val-inputs/gen-${{ needs.meta.outputs.particle }}.edm4hep.root"
      - name: Launch container
        # The mucoll-sim image is a public GHCR package, so no docker login is needed.
        run: |
          docker run -d --name ci --privileged --entrypoint tail \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ inputs.image }}" -f /dev/null
      - name: Simulation
        run: |
          docker exec -w /work \
            -e BM=/work/benchmarks \
            -e GEOM="${{ inputs.geometry }}" \
            -e NEV="${{ inputs.n-events }}" \
            ci /bin/bash /work/validation/run_chain.sh sim
      - name: Record production provenance
        env:
          IMAGE: ${{ inputs.image }}
          GEOMETRY: ${{ inputs.geometry }}
          N_EVENTS: ${{ inputs.n-events }}
          PARTICLE: ${{ needs.meta.outputs.particle }}
          PDG: ${{ inputs.pdg }}
        run: |
          input_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/phys-val-inputs/gen-${PARTICLE}.edm4hep.root"
          image_id="$(docker inspect --format='{{.Image}}' ci)"
          image_platform="$(docker image inspect --format='{{.Os}}/{{.Architecture}}' "${image_id}")"
          python3 validation/write_provenance.py \
            --input gen.edm4hep.root \
            --input-source "${input_url}" \
            --events "${N_EVENTS}" \
            --particle "${PARTICLE}" \
            --pdg "${PDG}" \
            --geometry "${GEOMETRY}" \
            --image-reference "${IMAGE}" \
            --image-id "${image_id}" \
            --image-platform "${image_platform}" \
            --benchmarks-revision "$(git -C benchmarks rev-parse HEAD)" \
            --spack-revision "${GITHUB_SHA}" \
            --output submission.json
      - uses: actions/upload-artifact@v7
        with:
          name: sim-${{ needs.meta.outputs.particle }}
          path: |
            sim.edm4hep.root
            submission.json
          if-no-files-found: error

  digi:
    needs: [meta, sim]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false
      - uses: actions/checkout@v6
      - name: Clone benchmarks
        run: |
          git clone --branch "${BENCHMARKS_REF}" --depth 1 "${BENCHMARKS_REPO}" benchmarks
          git -C benchmarks submodule update --init --recursive --depth 1
      - uses: actions/download-artifact@v8
        with:
          name: sim-${{ needs.meta.outputs.particle }}
          path: .
      - name: Launch container
        # The mucoll-sim image is a public GHCR package, so no docker login is needed.
        run: |
          docker run -d --name ci --privileged --entrypoint tail \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ inputs.image }}" -f /dev/null
      - name: Digitisation
        run: |
          docker exec -w /work \
            -e BM=/work/benchmarks \
            -e GEOM="${{ inputs.geometry }}" \
            -e NEV="${{ inputs.n-events }}" \
            ci /bin/bash /work/validation/run_chain.sh digi
      - uses: actions/upload-artifact@v7
        with:
          name: digi-${{ needs.meta.outputs.particle }}
          path: |
            digi.edm4hep.root
            submission.json
          if-no-files-found: error

  reco:
    needs: [meta, digi]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false
      - uses: actions/checkout@v6
      - name: Clone benchmarks
        run: |
          git clone --branch "${BENCHMARKS_REF}" --depth 1 "${BENCHMARKS_REPO}" benchmarks
          git -C benchmarks submodule update --init --recursive --depth 1
      - uses: actions/download-artifact@v8
        with:
          name: digi-${{ needs.meta.outputs.particle }}
          path: .
      - name: Launch container
        # The mucoll-sim image is a public GHCR package, so no docker login is needed.
        run: |
          docker run -d --name ci --privileged --entrypoint tail \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ inputs.image }}" -f /dev/null
      - name: Reconstruction
        run: |
          docker exec -w /work \
            -e BM=/work/benchmarks \
            -e GEOM="${{ inputs.geometry }}" \
            -e NEV="${{ inputs.n-events }}" \
            ci /bin/bash /work/validation/run_chain.sh reco
      - uses: actions/upload-artifact@v7
        with:
          name: reco-${{ needs.meta.outputs.particle }}
          path: |
            reco.edm4hep.root
            submission.json
          if-no-files-found: error

  plot:
    needs: [meta, reco]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false
      - uses: actions/checkout@v6
      - name: Clone benchmarks
        run: |
          git clone --branch "${BENCHMARKS_REF}" --depth 1 "${BENCHMARKS_REPO}" benchmarks
          git -C benchmarks submodule update --init --recursive --depth 1
      - uses: actions/download-artifact@v8
        with:
          name: reco-${{ needs.meta.outputs.particle }}
          path: .
      - name: Launch container
        # The mucoll-sim image is a public GHCR package, so no docker login is needed.
        run: |
          docker run -d --name ci --privileged --entrypoint tail \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ inputs.image }}" -f /dev/null
      - name: Make performance plots
        run: |
          docker exec -w /work \
            -e BM=/work/benchmarks \
            -e GEOM="${{ inputs.geometry }}" \
            -e NEV="${{ inputs.n-events }}" \
            -e PDG="${{ inputs.pdg }}" \
            ci /bin/bash /work/validation/make_plots.sh "${{ needs.meta.outputs.particle }}"
      - name: Aggregate report-only metrics
        env:
          N_EVENTS: ${{ inputs.n-events }}
          PARTICLE: ${{ needs.meta.outputs.particle }}
        run: |
          docker exec -w /work \
            -e N_EVENTS="${N_EVENTS}" -e PARTICLE="${PARTICLE}" \
            ci /bin/bash -lc '
              source /opt/setup_mucoll.sh >/dev/null 2>&1
              fragment_args=()
              while IFS= read -r fragment; do
                fragment_args+=(--fragment "${fragment}")
              done < <(find /work/plot_work -name "metrics_*.json" -type f -print | sort)
              python /work/benchmarks/analysis/benchmarks/aggregate_metrics.py \
                --sample-label "${PARTICLE}" \
                --input /work/reco.edm4hep.root \
                --expected-events "${N_EVENTS}" \
                --production-metadata /work/submission.json \
                "${fragment_args[@]}" \
                --output /work/metrics.json
            '
      - name: Upload benchmark metrics
        uses: actions/upload-artifact@v7
        with:
          name: metrics-${{ needs.meta.outputs.particle }}
          path: |
            metrics.json
            submission.json
            plot_work/**/metrics_*.json
          if-no-files-found: error
      - name: Upload plots (per-particle Pages fragment)
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ needs.meta.outputs.particle }}
          path: public
          if-no-files-found: error
