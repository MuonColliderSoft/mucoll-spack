name: Reusable docker build template
description: |
  This workflow builds the image for a specific architecture and pushes it to the registry.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      registry:
        required: true
        type: string
      image-type:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      base-image:
        required: false
        type: string
        default: ''
      spec:
        required: false
        type: string
        default: ''
    outputs:
      image-uri:
        description: "The URI of the built image with digest"
        value: ${{ jobs.build-and-push.outputs.image-uri }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    outputs:
      # Digest-pinned, lowercased reference. Used both as a manifest source and
      # as the FROM (BASE_IMAGE) of the next layer, so it must be a valid docker
      # reference: lowercase repository (github.repository_owner is mixed-case)
      # and pinned by digest (avoids the metadata-action suffix being duplicated).
      image-uri: ${{ steps.imgref.outputs.lowercase }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
          testing: false   
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve spack pins from key4hep-spack
        # Resolve the key4hep-spack main SHA once and read both pin files *at
        # that SHA*, so the spack commit, the spack-packages commit and the
        # key4hep-spack checkout (whose .cherry-pick targets that spack-packages
        # commit) stay mutually consistent within a run. Only Dockerfile.base
        # consumes these; the layer Dockerfile ignores the unused build-args.
        id: pins
        run: |
          k4sha=$(git ls-remote https://github.com/key4hep/key4hep-spack.git main | cut -f1)
          echo "k4sha=$k4sha" >> "$GITHUB_OUTPUT"
          base="https://raw.githubusercontent.com/key4hep/key4hep-spack/$k4sha"
          echo "spack=$(curl -fsSL "$base/.latest-commit" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "packages=$(curl -fsSL "$base/.latest-packages-commit" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Lowercase image name
        id: imgref
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ inputs.registry }}/${{ github.repository_owner }}/mucoll-${{ inputs.image-type }}-${{ inputs.os }}
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/mucoll-${{ inputs.image-type }}-${{ inputs.os }}
          flavor: latest=false,suffix=-${{ inputs.platform }}
      - name: Collect build args
        # Assembled once and reused verbatim by both builds below
        id: args
        run: |
          {
            echo 'value<<BUILD_ARGS_EOF'
            echo "OS=${{ inputs.os }}"
            echo "BASE_IMAGE=${{ inputs.base-image }}"
            echo "SPEC=${{ inputs.spec }}"
            echo "GITHUB_REPOSITORY=${{ github.event.pull_request.head.repo.full_name || github.repository }}"
            echo "MUCOLL_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "SPACK_BUILDCACHE=oci://ghcr.io/${{ github.repository_owner }}/mucoll-buildcache"
            echo "OCI_USERNAME=${{ github.actor }}"
            echo "BRANCH=${{ github.ref_name }}"
            echo "SPACK_COMMIT=${{ steps.pins.outputs.spack }}"
            echo "SPACK_PACKAGES_COMMIT=${{ steps.pins.outputs.packages }}"
            echo "KEY4HEP_SPACK_SHA=${{ steps.pins.outputs.k4sha }}"
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/${{ inputs.platform }}
          context: ./Docker
          file: ./Docker/${{ inputs.dockerfile }}
          # Explicit: the check stages sit after the image stage in both
          # Dockerfiles, so the default (last stage) is not what we publish.
          target: image
          build-args: ${{ steps.args.outputs.value }}
          secrets: |
            "ocipass=${{ secrets.GITHUB_TOKEN }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check image packages
        # Runs check.py against the image that was just built, as another stage
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/${{ inputs.platform }}
          context: ./Docker
          build-contexts: |
            validation=./validation
          file: ./Docker/${{ inputs.dockerfile }}
          target: check-export
          outputs: type=local,dest=./image-check
          build-args: |
            ${{ steps.args.outputs.value }}
            IMAGE_TYPE=${{ inputs.image-type }}
          secrets: |
            "ocipass=${{ secrets.GITHUB_TOKEN }}"
      - name: Report package check
        # The check stage records check.py's exit status instead of failing the
        # build, so the observed inventory is exported (and uploaded below) on
        # the very run where it is wanted as the new baseline. Fail here on it.
        if: always()
        run: |
          if [ ! -f image-check/status ]; then
            echo "::error::the image package check produced no result"
            exit 1
          fi
          cp image-check/observed.json observed.json
          echo "::group::Observed package inventory"
          cat observed.json
          echo "::endgroup::"
          cat image-check/check.log
          exit "$(cat image-check/status)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-packages-${{ inputs.image-type }}-${{ inputs.platform }}
          path: observed.json
          if-no-files-found: warn
