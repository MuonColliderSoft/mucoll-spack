name: Physics validation (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation scale"
        type: choice
        default: fast
        options:
          - fast
          - full
      pdg:
        description: "Particle gun PDG id (label is inferred from it)"
        type: choice
        default: "211"
        options:
          - "13"    # muon
          - "11"     # electron
          - "211"    # pion
          - "22"     # photon (neutral)
      image:
        description: "Image to run the chain in"
        type: string
        default: ghcr.io/muoncollidersoft/mucoll-sim-ubuntu24:latest
      geometry:
        description: "Detector geometry name"
        type: string
        default: MAIA_v0
      n-events:
        description: "Number of events to simulate"
        type: string
        default: "10"
      benchmarks-ref:
        description: "mucoll-benchmarks branch, tag, or commit (fast mode)"
        type: string
        default: main

permissions:
  contents: read

jobs:
  physics-fast:
    if: inputs.mode == 'fast'
    uses: ./.github/workflows/physics-fast.yaml
    with:
      image: ${{ inputs.image }}
      pdg: ${{ inputs.pdg }}
      geometry: ${{ inputs.geometry }}
      n-events: ${{ inputs.n-events }}
      benchmarks-ref: ${{ inputs.benchmarks-ref }}

  physics-validation:
    if: inputs.mode == 'full'
    uses: ./.github/workflows/physics-validation-template.yaml
    with:
      image: ${{ inputs.image }}
      pdg: ${{ inputs.pdg }}
      geometry: ${{ inputs.geometry }}
      n-events: ${{ inputs.n-events }}
